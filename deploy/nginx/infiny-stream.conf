# Nginx reverse proxy for Infiny Stream — backend API + admin dashboard.
#
# Install on the VPS:
#   sudo cp deploy/nginx/infiny-stream.conf /etc/nginx/sites-available/infiny-stream
#   sudo ln -s /etc/nginx/sites-available/infiny-stream /etc/nginx/sites-enabled/
#   # replace api.VOTRE-DOMAINE.example everywhere below with your real domain first
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.votre-domaine.example
# certbot rewrites this file to add the HTTPS server block + redirect —
# that's expected, don't hand-add TLS directives here yourself.
#
# Rate limiting zone (product rule #51: rate limiting in front of the public
# API). 10 requests/second per IP, bursting up to 20 before requests queue.
limit_req_zone $binary_remote_addr zone=infiny_stream_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.VOTRE-DOMAINE.example;

    # Static admin dashboard — apps/admin/index.html is a single file with
    # no build step, served directly. Reachable at https://api.votre-domaine.example/admin/
    location /admin/ {
        alias /opt/infiny-stream/apps/admin/;
        index index.html;
    }

    location / {
        limit_req zone=infiny_stream_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
