# Customer web app (pairing + playlists) for infinistream.pro
#
# Distinct from deploy/nginx/infiny-stream.conf, which only serves the API
# and the admin dashboard on api.infinistream.pro. Do not merge the two.
#
# DNS: A records for infinistream.pro and www.infinistream.pro → VPS IP.
# Then:
#   sudo cp deploy/nginx/infiny-stream-web.conf /etc/nginx/sites-available/infiny-stream-web
#   sudo ln -s /etc/nginx/sites-available/infiny-stream-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d infinistream.pro -d www.infinistream.pro

server {
    listen 80;
    listen [::]:80;
    server_name infinistream.pro www.infinistream.pro;

    root /opt/infiny-stream/apps/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
