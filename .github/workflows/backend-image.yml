name: Build & push backend image

# Builds apps/backend/Dockerfile and pushes it to GitHub Container Registry
# whenever backend code (or a shared workspace it depends on) changes on
# main. The VPS only ever pulls this image (see docker-compose.yml and
# docs/GUIDE_VPS.md) — it never runs npm/nest build itself.
on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/types/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/infinistream-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Two tags on every push: "latest" (what the VPS's docker-compose.yml
      # pulls by default) and the commit SHA (for pinning IMAGE_TAG in
      # .env.production if you want a reproducible/rollback-able deploy
      # instead of always tracking main).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
