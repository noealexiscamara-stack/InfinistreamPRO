# Override for local/dev use: builds the backend image from source instead
# of pulling from ghcr.io. Combine with the base file — never used alone:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build backend
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.production up -d
#
# The VPS itself should NOT use this file (see docker-compose.yml) — it's
# for testing a Dockerfile/source change locally before pushing, so CI
# builds the real deployed image.

services:
  backend:
    image: infinistream-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
