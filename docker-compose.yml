# Production stack for a self-managed VPS: Postgres + the NestJS backend,
# both on a private network. Nginx (TLS termination + reverse proxy) is
# deliberately NOT included here — see deploy/nginx/infiny-stream.conf and
# docs/GUIDE_VPS.md, since most VPS setups run nginx directly on the host
# (sharing it with other sites) rather than in a container.
#
# Usage on the VPS, after `cp .env.production.example .env.production` and
# filling in real secrets:
#   docker compose --env-file .env.production up -d --build
#
# The backend is published on 127.0.0.1:3000 only — never expose it directly
# to the internet, nginx is what the public actually talks to (product rule
# #51: TLS + rate limiting in front of the API).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host at all — only the backend container talks to
    # it, over the default docker-compose network.

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Always false in production — schema changes go through migrations
      # (see docs/GUIDE_DEPLOIEMENT.md), never through auto-sync against a
      # populated database.
      DB_SYNCHRONIZE: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PREMIUM_BASE_PRICE: ${PREMIUM_BASE_PRICE:-5}
      PREMIUM_BASE_CURRENCY: ${PREMIUM_BASE_CURRENCY:-EUR}
      TRIAL_DAYS: ${TRIAL_DAYS:-30}
      DEVICE_LIMIT: ${DEVICE_LIMIT:-2}
      ORANGE_MONEY_API_KEY: ${ORANGE_MONEY_API_KEY:-}
      ORANGE_MONEY_API_SECRET: ${ORANGE_MONEY_API_SECRET:-}
      MTN_MOMO_API_KEY: ${MTN_MOMO_API_KEY:-}
      MTN_MOMO_API_SECRET: ${MTN_MOMO_API_SECRET:-}
      HOLOPAY_API_KEY: ${HOLOPAY_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
