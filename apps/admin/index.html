<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070B16" />
  <title>Infiny Stream — Administration</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <div class="brand" style="padding:0">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-copy">
          Infiny Stream
          <small>Administration</small>
        </div>
      </div>
      <p class="tagline">Accès réservé aux comptes administrateur.</p>
      <label for="api-base">URL du serveur</label>
      <input id="api-base" placeholder="http://localhost:3000" />
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="admin@infinystream.app" autocomplete="username" />
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="btn full" id="login-btn" type="button">Se connecter</button>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <div id="app-shell" class="shell hidden">
    <div class="shell-glow" aria-hidden="true"></div>
    <div id="backdrop" class="backdrop"></div>
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-copy">
          Infiny Stream
          <small>Admin</small>
        </div>
      </div>
      <nav id="nav-links" class="nav"></nav>
      <div class="nav-foot">
        <button class="btn ghost full" id="logout-btn" type="button" aria-label="Déconnexion">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6H5v12h4"/><path d="M10 12h9"/><path d="m15 8 4 4-4 4"/></svg>
          <span class="label">Déconnexion</span>
        </button>
      </div>
    </aside>
    <div class="main">
      <header class="header">
        <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu">☰</button>
        <h1 id="page-title">Tableau de bord</h1>
        <div class="profile">
          <span id="profile-email">Admin</span>
          <span class="avatar" id="profile-initial">A</span>
        </div>
      </header>
      <div class="content" id="page"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
